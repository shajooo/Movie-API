<div class="cineverse-wrapper">
  <div class="cineverse-hero">
    <div class="container">
      <h1 class="hero-title">Cineverse</h1>
      <p class="hero-subtitle">Discover movies from around the world</p>
      <div class="category-tabs">
        <button
          *ngFor="let cat of categories"
          class="tab-btn"
          [class.active]="activeCategory === cat.key"
          (click)="fetchMovies(cat.key)">
          {{ cat.label }}
        </button>
      </div>
    </div>
  </div>

  <div class="container py-4">
    <div *ngIf="loading" class="text-center my-5">
      <div class="spinner-border text-light" role="status"></div>
      <p class="mt-3 text-light">Loading movies…</p>
    </div>

    <div *ngIf="error && !loading" class="alert alert-danger">
      {{ error }}
      <button class="btn btn-link text-danger" (click)="fetchMovies(activeCategory)">Retry</button>
    </div>

    <div *ngIf="!loading && !error" class="movies-grid">
      <div class="movie-card" *ngFor="let movie of movies" (click)="goToDetail(movie.id)">
        <div class="poster-wrap">
          <img [src]="getPoster(movie.poster_path)" [alt]="movie.title" loading="lazy">
          <span class="rating-badge" [ngClass]="getRatingClass(movie.vote_average)">
            ★ {{ movie.vote_average | number:'1.1-1' }}
          </span>
        </div>
        <div class="movie-info">
          <h6 class="movie-title">{{ movie.title }}</h6>
          <p class="movie-year">{{ movie.release_date | date:'yyyy' }}</p>
          <p class="movie-overview">{{ movie.overview }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
